<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Поэзия ночи</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  height: 100vh;
  overflow: hidden;
  font-family: system-ui, sans-serif;
  background: radial-gradient(ellipse at bottom, #0b1020 0%, #05070f 60%, #02030a 100%);
  color: #eaeaea;
}

/* ===== SKY ===== */
.sky {
  position: absolute;
  inset: 0;
}

/* stars */
.star {
  position: absolute;
  width: 2px;
  height: 2px;
  background: white;
  border-radius: 50%;
  opacity: 0.15;
  animation: twinkle 7s infinite ease-in-out;
}

@keyframes twinkle {
  0%,100% { opacity: 0.1; transform: scale(1); }
  50% { opacity: 0.8; transform: scale(1.4); }
}

/* mountains */
.mountains {
  position: absolute;
  bottom: 28%;
  width: 100%;
  height: 40%;
}

.mountain {
  position: absolute;
  bottom: 0;
  width: 0;
  height: 0;
  border-left: 220px solid transparent;
  border-right: 220px solid transparent;
  border-bottom: 140px solid #0a0f1f;
  opacity: 0.8;
}

.m1 { left: 10%; transform: scale(1.2); }
.m2 { left: 40%; transform: scale(1.5); opacity: 0.6; }
.m3 { left: 65%; transform: scale(1.1); opacity: 0.7; }

/* lake */
.lake {
  position: absolute;
  bottom: 0;
  width: 100%;
  height: 35%;
  background: linear-gradient(to top, #050913, #0a1430);
}

.reflection {
  position: absolute;
  top: 0;
  width: 100%;
  height: 100%;
  background: inherit;
  transform: scaleY(-1);
  opacity: 0.25;
  filter: blur(2px);
}

/* ===== TREE (FIGURE-8 STYLE) ===== */
.tree {
  position: absolute;
  right: -80px;
  bottom: 18%;
  width: 260px;
  height: 360px;
}

/* trunk */
.trunk {
  position: absolute;
  right: 110px;
  bottom: 0;
  width: 28px;
  height: 160px;
  background: #2a1b12;
  border-radius: 12px;
}

/* crown - "8 shape" */
.crown-top,
.crown-bottom {
  position: absolute;
  right: 40px;
  width: 140px;
  height: 140px;
  background: radial-gradient(circle at 40% 40%, #1f6b3a, #0d3b22);
  border-radius: 50%;
}

/* top bigger */
.crown-top {
  bottom: 150px;
  transform: scale(1.15);
}

/* bottom smaller */
.crown-bottom {
  bottom: 70px;
  transform: scale(0.95);
}

/* subtle overlap blend */
.crown-top,
.crown-bottom {
  box-shadow: 0 0 30px rgba(0,0,0,0.2);
}

/* ===== CENTER TEXT (for future poems) ===== */
.center {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%,-50%);
  text-align: center;
  max-width: 70%;
}

/* ===== LEAVES ===== */
.leaf {
  position: absolute;
  width: 16px;
  height: 10px;
  background: linear-gradient(to right, #2f8f4e, #1f5f36);
  border-radius: 50%;
  opacity: 0.9;
  animation: fly linear forwards;
}

@keyframes fly {
  from {
    transform: translateX(0) translateY(0) rotate(0deg);
  }
  to {
    transform: translateX(-120vw) translateY(40vh) rotate(360deg);
  }
}

/* ===== UI ===== */
.ui {
  position: absolute;
  bottom: 20px;
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}

.search {
  width: 80%;
  max-width: 520px;
  padding: 10px 14px;
  border-radius: 20px;
  border: 1px solid rgba(255,255,255,0.2);
  background: rgba(0,0,0,0.35);
  color: white;
  outline: none;
}

.buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: center;
}

button {
  padding: 8px 14px;
  border-radius: 18px;
  border: 1px solid rgba(255,255,255,0.2);
  background: rgba(255,255,255,0.08);
  color: #eaeaea;
  cursor: pointer;
}

/* ===== RESPONSIVE ===== */
@media (max-width: 600px) {
  .tree {
    transform: scale(0.75);
    right: -120px;
  }

  .search {
    width: 92%;
  }
}
</style>
</head>

<body>

<div class="sky" id="sky">
  <div class="mountains">
    <div class="mountain m1"></div>
    <div class="mountain m2"></div>
    <div class="mountain m3"></div>
  </div>

  <div class="lake">
    <div class="reflection"></div>
  </div>
</div>

<!-- TREE -->
<div class="tree">
  <div class="trunk"></div>
  <div class="crown-top"></div>
  <div class="crown-bottom"></div>
</div>

<div id="poem-fragment" class="center"></div>

<div id="category-content" class="center" style="display:none; opacity:0;"></div>
  
<!-- UI -->
<div class="ui">
  <input class="search" placeholder="Поиск стихов..." id="search"/>

  <div class="buttons">
    <button onclick="openCategory('landscape')">Природа</button>
    <button onclick="openCategory('idea')">Идея</button>
    <button onclick="openCategory('thought')">Мысль</button>
    <button onclick="openCategory('undefined')">Неопределенная</button>
  </div>
</div>

<script>
/* ===== STARS ===== */
const sky = document.getElementById('sky');

for (let i = 0; i < 90; i++) {
  const s = document.createElement('div');
  s.className = 'star';
  s.style.left = Math.random() * 100 + '%';
  s.style.top = Math.random() * 60 + '%';
  s.style.animationDelay = Math.random() * 7 + 's';
  sky.appendChild(s);
}

/* ===== LEAVES (INFINITE FLOW) ===== */
function spawnLeaf() {
  const leaf = document.createElement('div');
  leaf.className = 'leaf';

  const y = Math.random() * window.innerHeight * 0.5;

  leaf.style.top = (window.innerHeight * 0.2 + y) + 'px';
  leaf.style.right = '-20px';

  const duration = 5 + Math.random() * 4;
  leaf.style.animationDuration = duration + 's';

  document.body.appendChild(leaf);

  setTimeout(() => leaf.remove(), duration * 1000);
}

function startLeaves() {
  setInterval(() => {
    if (Math.random() < 0.7) {
      spawnLeaf();
    }
  }, 350);
}

startLeaves();

/* ===== UI ===== */
function action(name) {
  alert("Категория: " + name);
}

document.getElementById("search").addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    alert("Поиск: " + e.target.value);
  }
});
</script>
  
<script src="script.js"></script>
  
</body>
</html>
